<!DOCTYPE html>
<html lang="bn">
<head>
  <base href="/iphone/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="নামাজের সময়, কুরআন, দোয়া, তাসবিহ, কিবলা ও রমজান — iPhone-এর জন্য Salah Time।">
  <meta name="theme-color" content="#063d29">
  <!-- iPhone: full-screen app from the home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Salah Time">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Salah Time</title>
  <style>
    html, body { margin: 0; height: 100%; background: #063d29; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 35%, #0f7a52 0%, #063d29 60%, #031f15 100%); transition: opacity .4s; z-index: 10;
      font-family: -apple-system, "Hind Siliguri", system-ui, sans-serif; color: #fff; }
    #splash img { width: 112px; height: 112px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(243,217,139,.75), 0 18px 40px rgba(0,0,0,.35); }
    #splash b { font-size: 30px; letter-spacing: .3px; }
    #splash i { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; position: relative; }
    #splash i:after { content: ""; position: absolute; inset: 0; width: 40%; background: #f3d98b; border-radius: 3px; animation: l 1.1s ease-in-out infinite; }
    @keyframes l { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""><b>Salah Time</b><i></i></div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var s = document.getElementById("splash");
      if (s) { s.style.opacity = "0"; setTimeout(function () { s.remove(); }, 450); }
    });
  </script>
  <!-- iPhone in Safari (not yet on the home screen): how to add it -->
  <div id="a2hs" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;background:#fff;color:#0f2a1f;border-radius:20px;padding:14px 16px 14px 14px;box-shadow:0 18px 50px rgba(0,0,0,.35);font-family:-apple-system,'Hind Siliguri',system-ui,sans-serif;font-size:14.5px;line-height:1.45">
    <div style="display:flex;gap:12px;align-items:center">
      <img src="icons/Icon-192.png" alt="" style="width:46px;height:46px;border-radius:12px;flex:none">
      <div style="flex:1"><b style="font-size:15.5px">হোম স্ক্রিনে রাখুন</b><br>নিচের <b>শেয়ার</b> বাটন <span style="display:inline-block;border:1.6px solid #0a84ff;color:#0a84ff;border-radius:5px;padding:0 4px;font-weight:800">&#8679;</span> চেপে <b>"Add to Home Screen"</b> দিন</div>
      <button id="a2hsX" aria-label="বন্ধ" style="border:0;background:#eef3f0;border-radius:50%;width:30px;height:30px;font-size:17px;color:#40594d;flex:none">&#10005;</button>
    </div>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
      var seen = 0; try { seen = +localStorage.getItem("a2hs_seen") || 0; } catch (e) {}
      if (!ios || standalone || Date.now() - seen < 3 * 864e5) return;
      var b = document.getElementById("a2hs");
      setTimeout(function () { b.style.display = "block"; }, 4000);
      document.getElementById("a2hsX").onclick = function () {
        b.style.display = "none"; try { localStorage.setItem("a2hs_seen", String(Date.now())); } catch (e) {}
      };
    })();
  </script>
  <!-- Firebase is shipped with the app (not loaded from Google at start), so it
       also opens offline; then the Flutter app starts. -->
  <script type="module">
    const load = async (n, v) => {
      try { window[v] = await import("./firebasejs/firebase-" + n + ".js"); } catch (e) { console.warn("firebase " + n, e); }
    };
    await load("app", "firebase_core");
    await Promise.all([load("firestore", "firebase_firestore"), load("auth", "firebase_auth"), load("messaging", "firebase_messaging")]);
    const s = document.createElement("script");
    s.src = "flutter_bootstrap.js"; s.async = true;
    document.body.appendChild(s);
  </script>
</body>
</html>

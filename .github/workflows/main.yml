name: Build APK
on:
  push:
    branches: [main, master]
    # website-only changes must not publish a new app release
    paths-ignore:
      - '*.html'
      - '*.png'
      - '*.jpg'
      - '*.mp4'
      - 'README.md'
      - 'iphone/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack bundle
        run: python3 "$(ls salah_bundle*.py | head -n 1)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-8.3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: app
        run: flutter create --platforms=android --org com.bgdph --project-name salah .

      - name: Patch Android config
        env:
          # AdMob App ID (not a secret): Settings > Secrets and variables > Actions > Variables
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: python3 tools/patch_android.py

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf "%s" "$KEYSTORE_BASE64" | tr -d " \r\n" | base64 -d > app/android/app/upload-keystore.jks
            echo "Signing key restored"
          else
            echo "WARNING: no KEYSTORE_BASE64 secret, using debug key (updates will not install over old versions)"
          fi

      - name: Verify signing key
        env:
          KEY_ALIAS_RAW: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD_RAW: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -f app/android/app/upload-keystore.jks ]; then
            A=$(printf "%s" "$KEY_ALIAS_RAW" | tr -d ' \r\n')
            P=$(printf "%s" "$STORE_PASSWORD_RAW" | tr -d ' \r\n')
            if keytool -list -keystore app/android/app/upload-keystore.jks -storepass "$P" -alias "$A" > /dev/null 2>&1; then
              echo "Signing key OK"
            else
              echo "ERROR: STORE_PASSWORD or KEY_ALIAS secret is wrong. Re-enter it in repo Settings > Secrets."
              exit 1
            fi
          fi

      - name: Build release APK
        working-directory: app
        env:
          KEY_ALIAS_RAW: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_RAW: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD_RAW: ${{ secrets.STORE_PASSWORD }}
        run: |
          export KEY_ALIAS=$(printf "%s" "$KEY_ALIAS_RAW" | tr -d ' \r\n')
          export KEY_PASSWORD=$(printf "%s" "$KEY_PASSWORD_RAW" | tr -d ' \r\n')
          export STORE_PASSWORD=$(printf "%s" "$STORE_PASSWORD_RAW" | tr -d ' \r\n')
          flutter pub get
          OUT=build/app/outputs/flutter-apk
          # versionCode 3000+run for ALL apks (old split apks used 1xxx/2xxx): any installed
          # variant can update to any new one; the version name stays 1.0.<run>
          VER="--build-name=1.0.${{ github.run_number }} --build-number=$((3000 + ${{ github.run_number }}))"
          # Gradle download sometimes fails with 504 from GitHub: retry up to 3 times
          for i in 1 2 3; do
            flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 $VER && break
            if [ $i = 3 ]; then exit 1; fi
            echo "Build failed, retrying in 20s..."; sleep 20
          done
          cp $OUT/app-arm64-v8a-release.apk $OUT/salah-time-arm64.apk
          cp $OUT/app-armeabi-v7a-release.apk $OUT/salah-time-arm.apk
          flutter build apk --release --target-platform android-arm,android-arm64 $VER
          cp $OUT/app-release.apk $OUT/salah-time.apk
          ls -lh $OUT/*.apk
          # all three APKs must carry the same versionCode, else switching between them fails
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -n 1)
          for f in $OUT/salah-time.apk $OUT/salah-time-arm64.apk $OUT/salah-time-arm.apk; do
            $AAPT dump badging "$f" | grep -o "versionCode='[0-9]*'"
          done | sort -u > /tmp/vc.txt
          cat /tmp/vc.txt
          if [ "$(wc -l < /tmp/vc.txt)" != "1" ]; then echo "ERROR: APK version codes differ"; exit 1; fi

      # Only main/master publish a release (users + website update from it).
      # Builds started from any other branch are test builds: APK as artifact only.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Salah Time 1.0.${{ github.run_number }}
          make_latest: true
          body_path: CHANGELOG.md
          files: |
            app/build/app/outputs/flutter-apk/salah-time.apk
            app/build/app/outputs/flutter-apk/salah-time-arm64.apk
            app/build/app/outputs/flutter-apk/salah-time-arm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: salah-time-apk
          path: app/build/app/outputs/flutter-apk/salah-time*.apk

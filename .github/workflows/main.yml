name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack bundle
        run: python3 "$(ls salah_bundle*.py | head -n 1)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: app
        run: flutter create --platforms=android --org com.bgdph --project-name salah .

      - name: Patch Android config
        run: python3 tools/patch_android.py

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
            echo "Signing key restored"
          else
            echo "WARNING: no KEYSTORE_BASE64 secret, using debug key (updates will not install over old versions)"
          fi

      - name: Build release APK
        working-directory: app
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/salah-time.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Salah Time 1.0.${{ github.run_number }}
          make_latest: true
          files: app/build/app/outputs/flutter-apk/salah-time.apk

      - uses: actions/upload-artifact@v4
        with:
          name: salah-time-apk
          path: app/build/app/outputs/flutter-apk/salah-time.apk

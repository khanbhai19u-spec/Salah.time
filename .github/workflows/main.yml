name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack bundle
        run: python3 "$(ls salah_bundle*.py | head -n 1)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: app
        run: flutter create --platforms=android --org com.bgdph --project-name salah .

      - name: Patch Android config
        run: python3 tools/patch_android.py

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf "%s" "$KEYSTORE_BASE64" | tr -d " \r\n" | base64 -d > app/android/app/upload-keystore.jks
            echo "Signing key restored"
          else
            echo "WARNING: no KEYSTORE_BASE64 secret, using debug key (updates will not install over old versions)"
          fi

      - name: Verify signing key
        env:
          KEY_ALIAS_RAW: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD_RAW: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -f app/android/app/upload-keystore.jks ]; then
            A=$(printf "%s" "$KEY_ALIAS_RAW" | tr -d ' \r\n')
            P=$(printf "%s" "$STORE_PASSWORD_RAW" | tr -d ' \r\n')
            if keytool -list -keystore app/android/app/upload-keystore.jks -storepass "$P" -alias "$A" > /dev/null 2>&1; then
              echo "Signing key OK"
            else
              echo "ERROR: STORE_PASSWORD or KEY_ALIAS secret is wrong. Re-enter it in repo Settings > Secrets."
              exit 1
            fi
          fi

      - name: Build release APK
        working-directory: app
        env:
          KEY_ALIAS_RAW: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_RAW: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD_RAW: ${{ secrets.STORE_PASSWORD }}
        run: |
          export KEY_ALIAS=$(printf "%s" "$KEY_ALIAS_RAW" | tr -d ' \r\n')
          export KEY_PASSWORD=$(printf "%s" "$KEY_PASSWORD_RAW" | tr -d ' \r\n')
          export STORE_PASSWORD=$(printf "%s" "$STORE_PASSWORD_RAW" | tr -d ' \r\n')
          flutter pub get
          OUT=build/app/outputs/flutter-apk
          VER="--build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}"
          # Small per-CPU APKs for the in-app updater (about half the size).
          # x86_64 is only for PC emulators, so it is left out of every APK.
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 $VER
          cp $OUT/app-arm64-v8a-release.apk $OUT/salah-time-arm64.apk
          cp $OUT/app-armeabi-v7a-release.apk $OUT/salah-time-arm.apk
          # Full APK (works on every phone) for sharing, the website and older app versions.
          flutter build apk --release --target-platform android-arm,android-arm64 $VER
          cp $OUT/app-release.apk $OUT/salah-time.apk
          ls -lh $OUT/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Salah Time 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            app/build/app/outputs/flutter-apk/salah-time.apk
            app/build/app/outputs/flutter-apk/salah-time-arm64.apk
            app/build/app/outputs/flutter-apk/salah-time-arm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: salah-time-apk
          path: app/build/app/outputs/flutter-apk/salah-time*.apk
